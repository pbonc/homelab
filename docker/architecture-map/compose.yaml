name: architecture-map

services:
  architecture-map:
    build:
      context: .
    image: homelab/architecture-map:0.2.0
    container_name: architecture-map
    ports:
      - "192.168.1.23:8040:8040"
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8040/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.20
    pids_limit: 32
