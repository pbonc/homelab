name: vulnerability-quiz-attacker

services:
  attacker:
    profiles:
      - attacker
    build:
      context: .
    image: homelab/vulnerability-quiz-attacker:0.1.0
    command:
      - -c
      - sleep infinity
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    labels:
      environment: purple_range
      expected_vulnerable: "false"
      notification_policy: never
    networks:
      - quiz-range

networks:
  quiz-range:
    internal: true

