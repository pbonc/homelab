name: homelab-purple-range

services:
  juice-shop:
    image: bkimminich/juice-shop:v20.0.0@sha256:28870b9d2bec49e605d6ebbf4b22ed1ec1ca0a72347ef19217bbbb21ea44e3fe
    platform: linux/amd64
    container_name: purple-range-juice-shop
    networks:
      - target-range
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then(r => {
            if (!r.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: "no"
    mem_limit: 768m
    cpus: 1.00
    pids_limit: 256

  range-gateway:
    image: nginx:1.29.1-alpine@sha256:60e48a050b6408d0c5dd59b98b6e36bf0937a0bbe99304e3e9c0e63b7563443a
    platform: linux/amd64
    container_name: purple-range-gateway
    depends_on:
      juice-shop:
        condition: service_healthy
    ports:
      - "127.0.0.1:3008:8080"
    networks:
      - range-ingress
      - target-range
    entrypoint:
      - nginx
      - -g
      - daemon off;
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: "no"
    mem_limit: 64m
    cpus: 0.20
    pids_limit: 64

  attacker:
    image: curlimages/curl:8.16.0@sha256:5a91ea0c9c3ee27b4abe657b68cf6bf0676afa13b236b3bda34283cb3924d4f6
    platform: linux/amd64
    profiles:
      - attacker
    networks:
      - target-range
    entrypoint:
      - /bin/sh
    command:
      - -c
      - sleep infinity
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

networks:
  range-ingress:
    name: homelab-purple-range-ingress
  target-range:
    name: homelab-purple-range-target
    internal: true
    labels:
      homelab.range.authorization: lab-owned-targets-only
      homelab.range.internet-access: denied
      homelab.range.production-access: denied
