global:
  resolve_timeout: 5m

route:
  receiver: ntfy
  group_by:
    - alertname
    - service
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: ntfy-test
      matchers:
        - alertname="HomelabNotificationTest"
      group_wait: 0s
      group_interval: 10s
      repeat_interval: 1h

receivers:
  - name: ntfy
    webhook_configs:
      - url: "http://192.168.1.23:8093/homelab-alerts?template=alertmanager"
        send_resolved: true
        max_alerts: 10
        http_config:
          basic_auth:
            username: homelab-publisher
            password_file: /run/secrets/ntfy_publisher_password

  - name: ntfy-test
    webhook_configs:
      - url: "http://192.168.1.23:8093/homelab-alerts?template=alertmanager"
        send_resolved: true
        max_alerts: 2
        http_config:
          basic_auth:
            username: homelab-publisher
            password_file: /run/secrets/ntfy_publisher_password

inhibit_rules:
  - source_matchers:
      - alertname="BrainRootDiskCritical"
    target_matchers:
      - alertname="BrainRootDiskHigh"
    equal:
      - instance
