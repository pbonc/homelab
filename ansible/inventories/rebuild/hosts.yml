---
all:
  children:
    rebuild_targets:
      hosts:
        rebuild-lab:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
          ansible_become_flags: -H -n
  vars:
    homelab_environment: rebuild
    homelab_timezone: America/Chicago
    # WSL2 receives clock synchronization from its Windows host.
    homelab_manage_time_service: false
    homelab_install_docker: true
