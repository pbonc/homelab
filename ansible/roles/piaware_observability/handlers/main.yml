---
- name: Reload PiAware systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart PiAware Node Exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    daemon_reload: true
    state: restarted
  when: not ansible_check_mode or piaware_exporter_before.rc == 0
